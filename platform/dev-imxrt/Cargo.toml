[package]
edition = "2021"
license = "MIT"
publish = false
name = "dev-imxrt"
version = "0.1.0"

[[bin]]
bench = false
name = "dev-imxrt"
test = false

[profile.release]
lto = true          # better optimizations
codegen-units = 1
debug = true
opt-level = "z"
panic = "abort"
incremental = false

# Optimize dependencies for size but keep root crate unoptimized for better debuggability
[profile.dev.package."*"]
opt-level = "z"

# Uncomment to turn off optimization for specific dependency (such as when debugging a service)
# [profile.dev.package.dependency-name]
# opt-level = 0

[lints.rust]
warnings = "deny"

[lints.clippy]
correctness = "deny"
perf = "deny"
suspicious = "deny"
style = "deny"

[dependencies]
cortex-m = { version = "0.7.7", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.3"
defmt = "0.3.6"
defmt-rtt = "0.4.0"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-imxrt = { git = "https://github.com/OpenDevicePartnership/embassy-imxrt", features = [
    "defmt",
    "time-driver-os-timer",
    "time",
    "mimxrt685s",
] }
uart-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
static_cell = "2.1.0"
platform-common = { path = "../platform-common", features = ["mock"] }

mimxrt600-fcb = "0.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[features]
# When enabled, replace the UART service with a built-in self-test that
# exercises each mock service (battery, thermal, time-alarm) and logs the
# results over defmt-rtt.
test-runner = []

[package.metadata.cargo-machete]
ignored = ["cortex-m", "cortex-m-rt"]

# Redirect all OpenDevicePartnership/embedded-services crates to the local
# checkout at D:\work\embedded-services for development.
[patch."https://github.com/OpenDevicePartnership/embedded-services"]
embedded-services = { path = "../../../embedded-services/embedded-service" }
battery-service = { path = "../../../embedded-services/battery-service" }
battery-service-interface = { path = "../../../embedded-services/battery-service-interface" }
battery-service-relay = { path = "../../../embedded-services/battery-service-relay" }
thermal-service = { path = "../../../embedded-services/thermal-service" }
thermal-service-interface = { path = "../../../embedded-services/thermal-service-interface" }
thermal-service-relay = { path = "../../../embedded-services/thermal-service-relay" }
time-alarm-service = { path = "../../../embedded-services/time-alarm-service" }
time-alarm-service-interface = { path = "../../../embedded-services/time-alarm-service-interface" }
time-alarm-service-relay = { path = "../../../embedded-services/time-alarm-service-relay" }
uart-service = { path = "../../../embedded-services/uart-service" }
odp-service-common = { path = "../../../embedded-services/odp-service-common" }
